name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: proco, POSTGRES_PASSWORD: proco, POSTGRES_DB: proco }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U proco" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B verify 2>&1 | tee mvn.log; test ${PIPESTATUS[0]} -eq 0
        working-directory: services
      - if: failure()
        run: |
          echo "## Maven errors" >> $GITHUB_STEP_SUMMARY
          grep -E '\[ERROR\]|Tests run|FAIL' services/mvn.log | head -80 >> $GITHUB_STEP_SUMMARY
          grep -E '\[ERROR\]|Caused by|Tests run:.*Fail' services/mvn.log | grep -v 'Re-run Maven\|-rf :\|Help 1\|For more information' | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint && pnpm -r test && pnpm -r build
